[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-control-server"
version = "2.0.0"
description = "FastAPI control plane and web dashboard for the Raspberry Pi robot"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0",
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "robot-protocol>=0.1.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "Pillow>=10.0",
    "pytest>=8.0",
    "websockets>=13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.setuptools.package-data]
server = [
    "static/*",
    "static/js/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../packages/robot-protocol/src"]
